<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
  <title id="title">Student and adult survey comparison</title>
  <desc id="desc">Students and adults reported similarly high knowledge after training. Adults gave higher ratings for presenter engagement, presenter subject knowledge, organization, recommendation, and likelihood of calling 988. Student values are orange; adult values are blue.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
    .title { font-size: 23px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #555; }
    .section { font-size: 16px; font-weight: 700; }
    .label { font-size: 13px; }
    .tick { font-size: 11px; fill: #666; }
    .student-value { font-size: 12px; font-weight: 700; fill: #c94f20; }
    .adult-value { font-size: 12px; font-weight: 700; fill: #2164a5; }
    .note { font-size: 12px; fill: #555; }
    .grid { stroke: #e4e4e1; stroke-width: 1; }
    .connector { stroke: #babbb8; stroke-width: 3; stroke-linecap: round; }
  </style>
  <rect width="960" height="590" fill="#fff"/>
  <text class="title" x="24" y="34">Students learn as much, but report a less engaging experience</text>
  <text class="subtitle" x="24" y="57">Share selecting Agree/Strongly agree, or 9–10 for recommendation and call likelihood</text>

  <circle cx="719" cy="82" r="6" fill="#eb6834"/>
  <text class="label" x="732" y="87">Students</text>
  <circle cx="824" cy="82" r="6" fill="#2a78d6"/>
  <text class="label" x="837" y="87">Adults</text>

  <text class="section" x="24" y="116">Knowledge after training</text>
  <text class="section" x="24" y="250">Training experience and intent</text>

  <g aria-hidden="true">
    <line class="grid" x1="330" y1="126" x2="330" y2="471"/>
    <line class="grid" x1="430" y1="126" x2="430" y2="471"/>
    <line class="grid" x1="530" y1="126" x2="530" y2="471"/>
    <line class="grid" x1="630" y1="126" x2="630" y2="471"/>
    <line class="grid" x1="730" y1="126" x2="730" y2="471"/>
    <text class="tick" x="330" y="490" text-anchor="middle">0%</text>
    <text class="tick" x="430" y="490" text-anchor="middle">25%</text>
    <text class="tick" x="530" y="490" text-anchor="middle">50%</text>
    <text class="tick" x="630" y="490" text-anchor="middle">75%</text>
    <text class="tick" x="730" y="490" text-anchor="middle">100%</text>
  </g>

  <g>
    <text class="label" x="24" y="147">Identify mental health crises</text>
    <line class="connector" x1="688.4" y1="143" x2="696" y2="143"/>
    <circle cx="688.4" cy="143" r="6" fill="#eb6834"/>
    <circle cx="696" cy="143" r="6" fill="#2a78d6"/>
    <text class="student-value" x="680" y="160" text-anchor="end">89.6%</text>
    <text class="adult-value" x="705" y="137">91.5%</text>

    <text class="label" x="24" y="185">Describe 988</text>
    <line class="connector" x1="691.2" y1="181" x2="694" y2="181"/>
    <circle cx="691.2" cy="181" r="6" fill="#eb6834"/>
    <circle cx="694" cy="181" r="6" fill="#2a78d6"/>
    <text class="student-value" x="682" y="198" text-anchor="end">90.3%</text>
    <text class="adult-value" x="703" y="175">91.0%</text>

    <text class="label" x="24" y="223">Know when to use 988</text>
    <line class="connector" x1="699.2" y1="219" x2="701.2" y2="219"/>
    <circle cx="699.2" cy="219" r="6" fill="#eb6834"/>
    <circle cx="701.2" cy="219" r="6" fill="#2a78d6"/>
    <text class="student-value" x="690" y="236" text-anchor="end">92.2%</text>
    <text class="adult-value" x="710" y="213">92.8%</text>

    <text class="label" x="24" y="281">Presenter engagement</text>
    <line class="connector" x1="675.2" y1="277" x2="710.4" y2="277"/>
    <circle cx="675.2" cy="277" r="6" fill="#eb6834"/>
    <circle cx="710.4" cy="277" r="6" fill="#2a78d6"/>
    <text class="student-value" x="666" y="294" text-anchor="end">86.3%</text>
    <text class="adult-value" x="720" y="271">95.1%</text>

    <text class="label" x="24" y="319">Presenter subject knowledge</text>
    <line class="connector" x1="684.8" y1="315" x2="716.4" y2="315"/>
    <circle cx="684.8" cy="315" r="6" fill="#eb6834"/>
    <circle cx="716.4" cy="315" r="6" fill="#2a78d6"/>
    <text class="student-value" x="675" y="332" text-anchor="end">88.7%</text>
    <text class="adult-value" x="726" y="309">96.6%</text>

    <text class="label" x="24" y="357">Training organization</text>
    <line class="connector" x1="692.8" y1="353" x2="712.4" y2="353"/>
    <circle cx="692.8" cy="353" r="6" fill="#eb6834"/>
    <circle cx="712.4" cy="353" r="6" fill="#2a78d6"/>
    <text class="student-value" x="683" y="370" text-anchor="end">90.7%</text>
    <text class="adult-value" x="722" y="347">95.6%</text>

    <text class="label" x="24" y="395">Would recommend (rating 9–10)</text>
    <line class="connector" x1="459.2" y1="391" x2="658.8" y2="391"/>
    <circle cx="459.2" cy="391" r="6" fill="#eb6834"/>
    <circle cx="658.8" cy="391" r="6" fill="#2a78d6"/>
    <text class="student-value" x="450" y="408" text-anchor="end">32.3%</text>
    <text class="adult-value" x="669" y="385">82.2%</text>

    <text class="label" x="24" y="433">Likely to call 988 (rating 9–10)</text>
    <line class="connector" x1="494.4" y1="429" x2="670" y2="429"/>
    <circle cx="494.4" cy="429" r="6" fill="#eb6834"/>
    <circle cx="670" cy="429" r="6" fill="#2a78d6"/>
    <text class="student-value" x="485" y="446" text-anchor="end">41.1%</text>
    <text class="adult-value" x="680" y="423">85.0%</text>
  </g>

  <text class="note" x="24" y="524">Item response counts (students/adults): knowledge 1,076/223; presenter engagement 920/205, subject knowledge 918/205,</text>
  <text class="note" x="24" y="542">organization 913/205; recommend 1,047/219; likely to call 253/40. Percentages use valid answers to each item.</text>
  <text class="note" x="24" y="566">The call-likelihood item appeared on only some survey versions; the adult estimate is based on 40 responses.</text>
</svg>
